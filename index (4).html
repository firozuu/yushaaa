<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Dasara Fireworks</title>
<style>
:root{--bg:#000010;--fg:#fff;--accent:#ffc828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(90%,360px)}
#panel h1{font-size:1.6rem;margin:0 0 14px;color:var(--accent)}
#panel input{width:100%;box-sizing:border-box;padding:12px;font-size:1.1rem;border-radius:10px;border:2px solid var(--accent);background:#0b0b2a;color:var(--fg);text-align:center}
#panel button{margin-top:12px;padding:12px 28px;font-size:1.1rem;border:0;border-radius:10px;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
#replay{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:none;padding:8px 14px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer}
#wish small{display:block;margin-top:6px;font-size:.72em;opacity:.92}
#wish{padding:0 16px;box-sizing:border-box;position:fixed;left:0;right:0;bottom:calc(16% + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(1rem,3.4vw,1.6rem);color:#ffe9a8;text-shadow:0 0 14px #ff5e7e,0 0 28px #ffc828;opacity:0;transition:opacity 1.5s;pointer-events:none;z-index:3;letter-spacing:.04em}
#mute{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;display:none;padding:8px 12px;border:1px solid var(--accent);border-radius:999px;background:#0008;color:var(--accent);cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="wish">Every sunrise you dream of is built in the quiet hours when no one is clapping. 🌅<small>Keep believing, keep working. Your career will shine and victory will find you, <span id="wname"></span>!</small></div>
<button id="mute">🔊</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, name = (new URLSearchParams(location.search).get('name') || 'Prathyushaa').slice(0, 24);
const COLORS = ['#ff5050','#ffc800','#50ff78','#50b4ff','#ff78dc','#ff9628','#c878ff'];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const HUE = Array.from({ length: 36 }, (_, i) => `hsl(${i * 10},100%,62%)`);

let DPR = 1;
function resize(){ DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', resize); resize();

let points = [];
function buildPoints(){
  const S = 2, off = document.createElement('canvas'); off.width = W * S; off.height = H * S;
  const o = off.getContext('2d');
  const FONT = z => `800 ${z * S}px "Arial Black", Arial, sans-serif`;
  const lines = [['Happy Dasara!', Math.min(120, W / 7.5)], [name, Math.min(100, W / 8.5)]];
  const fonts = lines.map(([t, sz]) => {
    let size = sz;
    do { o.font = FONT(size); size -= 4; } while (o.measureText(t).width > (W - 40) * S && size > 14);
    return size + 4;
  });
  const gap = 20, total = fonts.reduce((a, f) => a + f, 0) + gap;
  let y = (H - total) / 2 - 30, split = 0;
  o.textAlign = 'center'; o.textBaseline = 'top'; o.fillStyle = '#fff';
  lines.forEach(([t], i) => {
    o.font = FONT(fonts[i]); o.fillText(t, W * S / 2, y * S);
    y += fonts[i] + gap; if (i === 0) split = y - gap / 2;
  });
  const d = o.getImageData(0, 0, W * S, H * S).data, step = W < 600 ? 2 : 3, w2 = W * S;
  points = [];
  for (let py = 0; py < H * S; py += step) for (let px = 0; px < w2; px += step) {
    if (d[(py * w2 + px) * 4 + 3] > 140) {
      const cx = px / S, cy = py / S, line = cy < split ? 0 : 1;
      points.push([cx, cy, null, line, (cx / W * 360 + line * 180) % 360]);
    }
  }
}

// ---- Background: dusk sky, twinkling stars, moon, temple skyline, burst flashes ----
const bgc = document.createElement('canvas'), bx = bgc.getContext('2d');
let stars = [], skyline = null, milky = null, clouds = [], cloudSprites = [], flash = 0, fx = 0, fy = 0, fh = 0, lanterns = [], meteors = [], hearts = [], petals = [], bt = 0;
function initBg(){
  bgc.width = W; bgc.height = H;
  stars = Array.from({ length: Math.floor(W * H / 5500) }, () => ({ x: rnd(0, W), y: rnd(0, H * .85), r: rnd(.5, 1.8), ph: rnd(0, 7), sp: rnd(.02, .09) }));
  lanterns = Array.from({ length: Math.max(8, Math.floor(W / 70)) }, () => ({ x: rnd(0, W), y: rnd(0, H), vy: rnd(.25, .6), ph: rnd(0, 7), sz: rnd(7, 13), hue: rnd(20, 45) }));
  hearts = Array.from({ length: Math.max(10, Math.floor(W / 60)) }, () => ({ x: rnd(0, W), y: rnd(0, H), vy: rnd(.5, 1.3), s: rnd(5, 13), ph: rnd(0, 7), hue: rnd(300, 360) }));
  petals = Array.from({ length: Math.max(20, Math.floor(W / 28)) }, () => ({ x: rnd(0, W), y: rnd(-H, H), vy: rnd(.6, 1.6), vx: rnd(-.4, .4), r: rnd(3, 6), a: rnd(0, 7), va: rnd(-.05, .05), hue: pick([18, 32, 45, 330, 345]) }));
  buildSky();
  skyline = document.createElement('canvas'); skyline.width = W; skyline.height = H;
  const s = skyline.getContext('2d');
  let x = -10;
  while (x < W){
    const temple = Math.random() < .14, w = temple ? rnd(60, 90) : rnd(25, 60), h = rnd(H * .04, H * .12);
    s.fillStyle = '#04020d';
    s.fillRect(x, H - h, w, h);
    if (temple){
      for (let k = 0; k < 4; k++){
        const tw = w * (1 - k * .22), ty = H - h - k * 18;
        s.beginPath(); s.moveTo(x + w / 2 - tw / 2, ty); s.lineTo(x + w / 2 + tw / 2, ty); s.lineTo(x + w / 2, ty - 26); s.closePath(); s.fill();
      }
      s.beginPath(); s.arc(x + w / 2, H - h - 80, 4, 0, 7); s.fill();
    } else {
      s.fillStyle = 'rgba(255,205,110,.75)';
      for (let wy = H - h + 8; wy < H - 6; wy += 12) for (let wx = x + 5; wx < x + w - 6; wx += 10) if (Math.random() < .3) s.fillRect(wx, wy, 3, 4);
    }
    x += w + rnd(0, 6);
  }
  s.fillStyle = '#04020d'; s.fillRect(0, H - 14, W, 14);
}
function buildSky(){
  milky = document.createElement('canvas'); milky.width = W; milky.height = H;
  const m = milky.getContext('2d');
  m.translate(W * .5, H * .3); m.rotate(-.5);
  const mg3 = m.createLinearGradient(0, -H * .12, 0, H * .12);
  mg3.addColorStop(0, 'rgba(170,150,255,0)'); mg3.addColorStop(.5, 'rgba(190,170,255,.16)'); mg3.addColorStop(1, 'rgba(170,150,255,0)');
  m.fillStyle = mg3; m.fillRect(-W, -H * .12, W * 2, H * .24);
  for (let i = 0; i < 900; i++){
    const px = rnd(-W, W), py = (Math.random() + Math.random() + Math.random() - 1.5) * H * .12;
    m.fillStyle = `rgba(255,255,255,${rnd(.1, .6)})`; m.fillRect(px, py, rnd(.4, 1.2), rnd(.4, 1.2));
  }
  cloudSprites = [0, 1, 2].map(() => {
    const w = 360, h = 130, cv2 = document.createElement('canvas'); cv2.width = w; cv2.height = h;
    const k = cv2.getContext('2d');
    for (let i = 0; i < 16; i++){
      const bx2 = w * rnd(.15, .85), by = h * (.55 + rnd(-.18, .12)), r = h * rnd(.22, .5);
      const gr = k.createRadialGradient(bx2, by, 0, bx2, by, r);
      gr.addColorStop(0, 'rgba(210,200,240,.55)'); gr.addColorStop(1, 'rgba(210,200,240,0)');
      k.fillStyle = gr; k.fillRect(bx2 - r, by - r, r * 2, r * 2);
    }
    return cv2;
  });
  clouds = Array.from({ length: Math.max(6, Math.floor(W / 150)) }, () => ({ spr: pick(cloudSprites), x: rnd(-300, W), y: rnd(H * .1, H * .72), v: rnd(.12, .5), sc: rnd(.8, 2), a: rnd(.18, .42) }));
}
function heartPath(c, x, y, s){
  c.beginPath(); c.moveTo(x, y + s * .6);
  c.bezierCurveTo(x - s * 1.2, y - s * .1, x - s * .5, y - s, x, y - s * .35);
  c.bezierCurveTo(x + s * .5, y - s, x + s * 1.2, y - s * .1, x, y + s * .6);
  c.closePath();
}
function drawBg(){
  const g = bx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02010f'); g.addColorStop(.3, '#0b0a3a'); g.addColorStop(.6, '#2a0f55'); g.addColorStop(.85, '#7a1f5c'); g.addColorStop(1, '#e0603a');
  bx.fillStyle = g; bx.fillRect(0, 0, W, H);
  bt += .012;
  bx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++){
    const cx = W * (.2 + .3 * k + .08 * Math.sin(bt + k * 2)), cy = H * (.28 + .08 * Math.cos(bt * .7 + k)), rr = Math.max(W, H) * .5;
    const ag = bx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    ag.addColorStop(0, `hsla(${(170 + k * 70 + bt * 12) % 360},90%,55%,.16)`); ag.addColorStop(1, 'hsla(0,0%,0%,0)');
    bx.fillStyle = ag; bx.fillRect(0, 0, W, H);
  }
  bx.globalCompositeOperation = 'source-over';
  bx.drawImage(milky, 0, 0);
  const mx = W * .85, my = H * .14, mr = Math.min(W, H) * .05;
  const mg = bx.createRadialGradient(mx, my, mr * .5, mx, my, mr * 4);
  mg.addColorStop(0, 'rgba(255,240,200,.45)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  bx.fillStyle = mg; bx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  bx.fillStyle = '#fff3cf'; bx.beginPath(); bx.arc(mx, my, mr, 0, 7); bx.fill();
  bx.fillStyle = '#fff';
  for (const s of stars){ s.ph += s.sp; bx.globalAlpha = .45 + .55 * Math.sin(s.ph); bx.fillRect(s.x, s.y, s.r, s.r); }
  bx.globalAlpha = 1;
  if (flash > .01){
    const fg = bx.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * .7);
    fg.addColorStop(0, `hsla(${fh},100%,60%,${flash * .5})`); fg.addColorStop(1, `hsla(${fh},100%,50%,0)`);
    bx.fillStyle = fg; bx.fillRect(0, 0, W, H);
    flash *= .92;
  }
  beatPulse *= .9;
  { // rangoli mandala glowing behind the text, pulsing with the music
    const cx = W / 2, cy = H / 2 - 30, R = Math.min(W, H) * (.3 + .02 * beatPulse);
    bx.save(); bx.translate(cx, cy); bx.globalCompositeOperation = 'lighter';
    for (let ring = 0; ring < 3; ring++){
      const n = 12 + ring * 6, rr = R * (1 - ring * .22), dir = ring % 2 ? -1 : 1;
      bx.save(); bx.rotate(bt * .35 * dir);
      for (let i = 0; i < n; i++){
        bx.rotate(Math.PI * 2 / n);
        bx.fillStyle = `hsla(${(bt * 40 + i * 360 / n + ring * 60) % 360},95%,60%,${.07 + .08 * beatPulse})`;
        bx.beginPath(); bx.ellipse(0, -rr, rr * .09, rr * .26, 0, 0, 7); bx.fill();
      }
      bx.restore();
    }
    bx.restore();
  }
  if (beatPulse > .02){
    bx.globalCompositeOperation = 'lighter'; bx.fillStyle = `hsla(${(bt * 40) % 360},90%,50%,${beatPulse * .06})`;
    bx.fillRect(0, 0, W, H); bx.globalCompositeOperation = 'source-over';
  }
  for (const cl of clouds){
    const cw = 360 * cl.sc, ch = 130 * cl.sc;
    cl.x += cl.v; if (cl.x > W) cl.x = -cw;
    bx.globalAlpha = cl.a; bx.drawImage(cl.spr, cl.x, cl.y, cw, ch);
    if (flash > .05){ bx.globalCompositeOperation = 'lighter'; bx.globalAlpha = Math.min(1, flash * cl.a * 1.6); bx.drawImage(cl.spr, cl.x, cl.y, cw, ch); bx.globalCompositeOperation = 'source-over'; }
  }
  bx.globalAlpha = 1;
  if (Math.random() < .008) meteors.push({ x: rnd(W * .2, W), y: rnd(0, H * .35), vx: -rnd(8, 14), vy: rnd(3, 6), life: 40 });
  for (const m of meteors){
    m.x += m.vx; m.y += m.vy; m.life--;
    const mg2 = bx.createLinearGradient(m.x, m.y, m.x - m.vx * 6, m.y - m.vy * 6);
    mg2.addColorStop(0, `rgba(255,255,255,${m.life / 40})`); mg2.addColorStop(1, 'rgba(255,255,255,0)');
    bx.strokeStyle = mg2; bx.lineWidth = 2; bx.beginPath(); bx.moveTo(m.x, m.y); bx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6); bx.stroke();
  }
  meteors = meteors.filter(m => m.life > 0);
  bx.globalCompositeOperation = 'lighter';
  for (const l of lanterns){
    l.y -= l.vy; l.ph += .02;
    if (l.y < -30){ l.y = H + 20; l.x = rnd(0, W); }
    const lx = l.x + Math.sin(l.ph) * 14, fl = .8 + .2 * Math.sin(l.ph * 6);
    const lg = bx.createRadialGradient(lx, l.y, 0, lx, l.y, l.sz * 4);
    lg.addColorStop(0, `hsla(${l.hue},100%,60%,${.55 * fl})`); lg.addColorStop(1, `hsla(${l.hue},100%,50%,0)`);
    bx.fillStyle = lg; bx.fillRect(lx - l.sz * 4, l.y - l.sz * 4, l.sz * 8, l.sz * 8);
    bx.fillStyle = `hsla(${l.hue + 10},100%,70%,${.9 * fl})`; bx.fillRect(lx - l.sz / 2, l.y - l.sz * .6, l.sz, l.sz * 1.2);
  }
  bx.globalCompositeOperation = 'source-over';
  bx.globalCompositeOperation = 'lighter';
  for (const h of hearts){
    h.y -= h.vy; h.ph += .03; if (h.y < -20){ h.y = H + 20; h.x = rnd(0, W); }
    const hx = h.x + Math.sin(h.ph) * 18, sc = h.s * (1 + .25 * beatPulse);
    bx.fillStyle = `hsla(${h.hue},100%,65%,.55)`; heartPath(bx, hx, h.y, sc); bx.fill();
  }
  for (const p of petals){
    p.y += p.vy; p.x += p.vx + Math.sin(p.a) * .6; p.a += p.va; if (p.y > H){ p.y = -10; p.x = rnd(0, W); }
    bx.save(); bx.translate(p.x, p.y); bx.rotate(p.a); bx.fillStyle = `hsla(${p.hue},100%,60%,.55)`;
    bx.beginPath(); bx.ellipse(0, 0, p.r, p.r * .5, 0, 0, 7); bx.fill(); bx.restore();
  }
  bx.globalCompositeOperation = 'source-over';
  bx.drawImage(skyline, 0, 0);
  bx.globalCompositeOperation = 'lighter';
  for (let i = 0, gap = 38; i * gap < W + gap; i++){
    const dx = i * gap + 14, f = 1 + .25 * Math.sin(bt * 9 + i * 1.7) + .1 * Math.sin(bt * 23 + i);
    const dg = bx.createRadialGradient(dx, H - 9, 0, dx, H - 9, 26 * f);
    dg.addColorStop(0, 'rgba(255,170,60,.5)'); dg.addColorStop(1, 'rgba(255,120,20,0)');
    bx.fillStyle = dg; bx.fillRect(dx - 30, H - 40, 60, 40);
    bx.fillStyle = '#ffd36b'; bx.beginPath(); bx.ellipse(dx, H - 10 - 2 * f, 2.2, 4.2 * f, 0, 0, 7); bx.fill();
  }
  bx.globalCompositeOperation = 'source-over';
}
function idleLoop(){
  if (running) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawBg(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.drawImage(bgc, 0, 0);
  requestAnimationFrame(idleLoop);
}

  const tones = [ch[0] + 12, ch[1] + 12, ch[2] + 12, ch[0] + 24], arp = [0, 1, 2, 3, 2, 1, 2, 1];
  arp.forEach((a, i) => voice(mtof(tones[a]), 'triangle', t + i * BEAT / 2, BEAT * 1.6, .06, bus));
  mel.forEach((n, i) => { if (n){ voice(mtof(n), 'sine', t + i * BEAT, BEAT * 1.7, .1, bus); voice(mtof(n + 12), 'triangle', t + i * BEAT, BEAT * 1.2, .02, bus); } });
  kick(t); kick(t + BEAT * 2);
  for (let i = 0; i < 4; i++) shaker(t + (i + .5) * BEAT);
}
function startSynth(){
  if (synthOn) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted ? 0 : .85; master.connect(AC.destination);
  bus = AC.createGain(); bus.connect(master);
  const conv = AC.createConvolver(), len = AC.sampleRate * 2.6, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  conv.buffer = ir; const send = AC.createGain(); send.gain.value = .45; bus.connect(send); send.connect(conv); conv.connect(master);
  const dl = AC.createDelay(1), fb = AC.createGain(), dg = AC.createGain();
  dl.delayTime.value = BEAT * .75; fb.gain.value = .32; dg.gain.value = .35;
  bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(dg); dg.connect(master);
  t0 = AC.currentTime + .15; nextBar = t0; barNo = 0; synthOn = true;
  const pump = () => { while (nextBar < AC.currentTime + 1.5){ scheduleBar(nextBar, barNo++); nextBar += BEAT * 4; } };
  pump(); setInterval(pump, 250);
}
function startAudio(){
  if (BGM_FILE.startsWith('data:')){
    // embedded BGM: decode with Web Audio (no <audio> element, so it works even where media URLs are blocked)
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    const bin = atob(BGM_FILE.split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    AC.decodeAudioData(bytes.buffer, buf => {
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(master); songLen = buf.duration; songT0 = AC.currentTime; songOn = true; src.start(songT0);
    }, () => { muteEl.textContent = '⚠ audio error'; });
  } else if (BGM_FILE){
    bgmEl = new Audio(BGM_FILE); bgmEl.loop = true; bgmEl.volume = 1; bgmEl.muted = muted;
    bgmEl.addEventListener('error', () => { muteEl.textContent = '⚠ audio error'; });
    bgmEl.play().catch(() => {});
  } else startSynth();
}
function onBeat(b){
  beatPulse = 1;
  if (running && b % 4 === 0 && !(queue.length && textTimer < WRITE)) rockets.push(newRocket(false));
}

let rockets, sparks, letters, frame, finale, textTimer, queue = [], written = 0, head = null;
const INTRO = 150, HOLD = 420, WRITE = 340;

function reset(){ rockets = []; sparks = []; letters = []; queue = []; written = 0; head = null; frame = 0; finale = false; textTimer = 0; }

function newRocket(isFinale){
  return { fin: isFinale, x: isFinale ? W / 2 : rnd(W * .15, W * .85), y: H,
           ty: isFinale ? H / 2 - 20 : rnd(H * .18, H * .5), vy: isFinale ? -H / 55 : -rnd(H / 70, H / 58),
           color: pick(COLORS), dead: false };
}
function spark(x, y, vx, vy, color, life, size, g){ sparks.push({ x, y, vx, vy, color, life, max: life, size: size || 2.5, g: g === undefined ? .08 : g }); }
function explode(x, y){
  // random shape: 0 sphere, 1 ring, 2 heart, 3 ring + sphere; every spark gets a rainbow hue
  const h0 = rnd(0, 360), type = Math.random() < .3 ? 2 : Math.floor(rnd(0, 5)), n = 150;
  flash = Math.min(1, flash + .5); fx = x; fy = y; fh = h0;
  for (let i = 0; i < n; i++){
    const t = i / n, a = t * Math.PI * 2, s = rnd(1, 6.5);
    let vx, vy;
    if (type === 1){ vx = Math.cos(a) * 5; vy = Math.sin(a) * 5; }
    else if (type === 2){
      vx = .33 * 16 * Math.pow(Math.sin(a), 3);
      vy = -.33 * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
    }
    else if (type === 4){ const r = 6 * Math.abs(Math.cos(2.5 * a)); vx = Math.cos(a) * r; vy = Math.sin(a) * r; }
    else if (type === 3 && i % 2){ vx = Math.cos(a) * 3.2; vy = Math.sin(a) * 3.2; }
    else { const b = rnd(0, Math.PI * 2); vx = Math.cos(b) * s; vy = Math.sin(b) * s; }
    spark(x, y, vx, vy, `hsl(${(h0 + t * 300) % 360},100%,62%)`, Math.floor(rnd(55, 95)), rnd(2, 3.4), .05);
  }
  for (let i = 0; i < 40; i++){
    const b = rnd(0, Math.PI * 2), s = rnd(.5, 7);
    spark(x, y, Math.cos(b) * s, Math.sin(b) * s, '#ffffff', Math.floor(rnd(30, 60)), 1.2, .06);
  }
}

function step(){
  frame++;
  if (synthOn || songOn){
    let b;
    if (synthOn) b = Math.floor((AC.currentTime - t0) / BEAT);
    else {
      const el = AC.currentTime - songT0, loops = Math.floor(el / songLen), pos = el - loops * songLen;
      b = loops * 1000 + Math.floor((pos - SONG_PH) / (60 / SONG_BPM));
    }
    if (b !== lastBeat && b >= 0){ lastBeat = b; onBeat(b); }
  } else if (frame % 46 === 0) onBeat(frame / 46);
  wishEl.style.opacity = (queue.length && textTimer > WRITE * .85 && textTimer < WRITE + HOLD) ? 1 : 0;
  if (!finale && frame % 22 === 0) rockets.push(newRocket(false));
  else if (finale && frame % 30 === 0 && Math.random() < .6) rockets.push(newRocket(false));
  if (frame === INTRO && !finale){ finale = true; rockets.push(newRocket(true)); }

  for (const r of rockets){
    r.y += r.vy;
    spark(r.x, r.y, rnd(-.3, .3), rnd(.5, 1.5), r.color, 20, 2.2);
    if (r.y <= r.ty){
      r.dead = true;
      if (r.fin){
        textTimer = 0; written = 0;
        queue = points.slice().sort((a, b) => a[3] - b[3] || a[0] - b[0] || a[1] - b[1]);
        for (let k = 0; k < 3; k++) explode(r.x, r.y, pick(COLORS));
      } else explode(r.x, r.y, r.color);
    }
  }
  rockets = rockets.filter(r => !r.dead);

  for (const s of sparks){ s.x += s.vx; s.y += s.vy; s.vy += s.g; s.vx *= .99; s.life--; }
  sparks = sparks.filter(s => s.life > 0);

  if (queue.length){
    textTimer++;
    if (textTimer < WRITE){
      // slow-motion writing: reveal letters bit by bit, each point throws slow sparks
      const n = Math.ceil(queue.length / WRITE);
      for (let k = 0; k < n && written < queue.length; k++, written++){
        const [tx, ty, , , hue] = queue[written];
        letters.push({ x: tx, y: ty, h: hue, vy: 0, fall: false, born: textTimer });
        if (written % 3 === 0) spark(tx, ty, rnd(-.7, .7), rnd(-.9, .3), pick(['#ffffff', HUE[Math.floor(hue / 10) % 36], '#ffd27a']), Math.floor(rnd(35, 70)), rnd(1, 2.2), .02);
      }
    }
    if (textTimer === WRITE) for (let k = 0; k < 6; k++) rockets.push(newRocket(false));
    head = (written > 0 && written < queue.length) ? queue[written - 1] : null;
    if (textTimer > WRITE + HOLD) for (const l of letters) l.fall = true;
    for (const l of letters) if (l.fall){ l.vy += .12; l.y += l.vy; l.x += rnd(-.3, .3); }
    if (textTimer > WRITE + HOLD + 120){ letters = []; queue = []; head = null; frame = INTRO - 60; finale = false; }
  }
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over';
  drawBg(); ctx.globalAlpha = .16; ctx.drawImage(bgc, 0, 0); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rockets){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, 7); ctx.fill(); }
  for (const s of sparks){
    ctx.globalAlpha = Math.max(s.life / s.max, 0); ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  const hs = Math.floor(textTimer * .2), P = [];
  for (let k = 0; k < 36; k++) P.push(new Path2D());
  ctx.fillStyle = '#fff';
  for (const l of letters){
    if (textTimer - l.born < 10){ ctx.fillRect(l.x - 1.3, l.y - 1.3, 2.6, 2.6); continue; }
    P[Math.floor(l.h / 10) % 36].rect(l.x - .95, l.y - .95, 1.9, 1.9);
  }
  for (let k = 0; k < 36; k++){ ctx.fillStyle = HUE[(k + hs) % 36]; ctx.fill(P[k]); }
  ctx.globalCompositeOperation = 'lighter';
  if (head){
    ctx.shadowBlur = 25; ctx.shadowColor = `hsl(${(textTimer * 8) % 360},100%,60%)`; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(head[0], head[1], 5, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let last = 0, acc = 0, running = false;
function loop(t){
  if (!running) return;
  acc += Math.min(t - last, 100); last = t;
  while (acc >= 1000 / 60){ step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}

function start(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, W, H);
  initBg(); buildPoints(); reset();
  running = true; last = performance.now(); requestAnimationFrame(loop);
}
addEventListener('resize', () => { initBg(); if (running) buildPoints(); });
const muteEl = document.getElementById('mute');
muteEl.style.display = 'block';
document.getElementById('wname').textContent = new URLSearchParams(location.search).get('nick') || 'Yushuuu';
start(); startAudio();
if (AC) AC.resume().catch(() => {});   // plays by itself wherever the browser allows autoplay
// Browsers only allow sound after a first tap/click/key, so music begins automatically at that moment
const icon = () => muteEl.textContent = muted ? '🔇' : '🔊';
const needsTap = (AC && AC.state === 'suspended') || (bgmEl && bgmEl.paused);
if (needsTap) muteEl.textContent = '🔊 tap anywhere';
if (AC) AC.onstatechange = () => { if (AC.state === 'running') icon(); };
const EVS = ['pointerdown', 'pointerup', 'mousedown', 'click', 'touchstart', 'touchend', 'keydown'];
const unlock = () => {
  const done = () => { EVS.forEach(e => removeEventListener(e, unlock)); icon(); };
  if (AC && AC.state === 'suspended') AC.resume().then(done).catch(() => {});
  if (bgmEl && bgmEl.paused) bgmEl.play().then(done).catch(() => {});
};
EVS.forEach(e => addEventListener(e, unlock));
document.addEventListener('visibilitychange', () => { if (!document.hidden) unlock(); });
muteEl.onclick = () => {
  muted = !muted; icon();
  if (master) master.gain.value = muted ? 0 : (synthOn ? .85 : 1);
  if (bgmEl) bgmEl.muted = muted;
};
</script>
</body>
